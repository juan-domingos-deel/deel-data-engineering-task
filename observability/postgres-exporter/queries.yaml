pg_replication_slots:
  query: |
    SELECT slot_name,
           CASE WHEN active THEN 1 ELSE 0 END AS active,
           pg_wal_lsn_diff(pg_current_wal_lsn(), confirmed_flush_lsn)::BIGINT AS lag_bytes
    FROM pg_replication_slots
  master: true
  metrics:
    - slot_name:
        usage: LABEL
        description: Replication slot name
    - active:
        usage: GAUGE
        description: 1 if the slot is currently active (Debezium connected)
    - lag_bytes:
        usage: GAUGE
        description: WAL bytes retained for this slot (closes ADR-0001 D7)

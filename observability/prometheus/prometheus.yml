global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
    metrics_path: /metrics

  - job_name: consumer
    static_configs:
      - targets: ["consumer:8001"]
    metrics_path: /metrics

  - job_name: postgres-source
    static_configs:
      - targets: ["postgres-source-exporter:9187"]

  - job_name: postgres-analytics
    static_configs:
      - targets: ["postgres-analytics-exporter:9187"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: soda
    static_configs:
      - targets: ["soda-runner:8002"]
    metrics_path: /metrics
